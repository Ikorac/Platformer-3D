                d: config.d || 1,
                seg: config.seg || 10,
                dt: config.dt || 1,
                db: config.db || 1,
                sleep: config.sleep || false,
                glow: config.glow || false,
                message: config.message || "",
                speed: config.speed || 0,

                far: 0,

            };

                break;

                  message: obj.message,
                });

            }
            if(obj.sleep) {

            if(!obj.haveShadow) {

              Obj.material = material;

        function cubeCollide(p1X, p1Y, p1Z, p1W, p1H, p1D, p2X, p2Y, p2Z, p2W, p2H, p2D){

        scene.registerAfterRender(function() {
            //moves platforms
            pltfrm1.position.x += pltfrm1.speed;
            pltfrm1.far += pltfrm1.speed;
            if(Math.abs(pltfrm1.far) > pltfrm1.lngth) {
            	pltfrm1.speed *= -1;
                pltfrm1.far = 0;
            }
            pltfrm2.position.x += pltfrm2.speed;
            pltfrm2.far += pltfrm2.speed;
            if(Math.abs(pltfrm2.far) > pltfrm2.lngth) {
            	pltfrm2.speed *= -1;
                pltfrm2.far = 0;
            }
            pltfrm3.position.y += pltfrm3.speed;
            pltfrm3.far += pltfrm3.speed;
            if(Math.abs(pltfrm3.far) > pltfrm3.lngth) {
            	pltfrm3.speed *= -1;
                pltfrm3.far = 0;
            }
            pltfrm4.position.y += pltfrm4.speed;
            pltfrm4.far += pltfrm4.speed;
            if(Math.abs(pltfrm4.far) > pltfrm4.lngth) {
            	pltfrm4.speed *= -1;
                pltfrm4.far = 0;
            }
            //everything else
            
            //damping
            var vel = player.physicsImpostor.getLinearVelocity();
            player.physicsImpostor.setLinearVelocity(vel.scale(.95));

            plr.x = player.position.x;//update coors
            plr.y = player.position.y;
            plr.z = player.position.z;
            
            //text
            coordsDiv.textContent = "x: " + plr.x.toFixed(2) + "  y: " + plr.y.toFixed(2) + "  z: " + plr.z.toFixed(2);
            
            
            //finds camera stuff
            var forward = camera.getFrontPosition(1).subtract(camera.position);
            forward.y = 0;
            forward = forward.normalize().scale(0.7);

            var backward = BABYLON.Vector3.TransformCoordinates(forward, BABYLON.Matrix.RotationY(Math.PI));
            var left = BABYLON.Vector3.TransformCoordinates(forward, BABYLON.Matrix.RotationY((3 * Math.PI) / 2));
            var right = BABYLON.Vector3.TransformCoordinates(forward, BABYLON.Matrix.RotationY(Math.PI / 2));
            
            //key movements
            if (keys.w) { 
                player.applyImpulse(forward, player.getAbsolutePosition());
            }
            if (keys.s) {
                player.applyImpulse(backward, player.getAbsolutePosition());
            }
            if (keys.a) {
                player.applyImpulse(left, player.getAbsolutePosition());
            }
            if (keys.d) {
                player.applyImpulse(right, player.getAbsolutePosition());
            }
            camera.setTarget(player.position.clone());
            
            //special blocks (very very messy!)
            for (let i = 0; i < cubes.length; i++) {
                if (cubes[i].type === "lava" && cubesCollide(plr, cubes[i])) {
                    die();
                    break;
                }
                if (cubes[i].type === "trampoline" && cubesCollide(plr, cubes[i])) {
                	player.applyImpulse(new BABYLON.Vector3(0, 35, 0), player.getAbsolutePosition());   
                    cubes[i].squeeze = 1.5;
                }
                if (cubes[i].type === "gold" && cubesCollide(plr, cubes[i])) {
                	wonDiv.textContent = Math.floor(f / 60) + ":" + Math.floor(f % 60) + ":" + Math.floor(frame % 60);
                    win();
                    
                    break;
                }
                if (cubes[i].type === "portal1" && cubesCollide(plr, cubes[i])) {
                    player.position.y = 25;
                }
                if (cubesCollide(plr, cubes[i])) {
                	msgDiv.textContent = cubes[i].message;
                    
                }
                if(cubes[i].squeeze > 1) {
                	cubes[i].squeeze --;
                }
            }
            
            //raycast for collisions
            var origin = player.getAbsolutePosition().clone();
            var ray = new BABYLON.Ray(origin, new BABYLON.Vector3(0, -1, 0), 0.8); // reach just below feet
            var hit = scene.pickWithRay(ray, function(mesh) {
                return mesh.isPickable && mesh !== player;
            });
            
            //can he jump
            canJump = !!(hit && hit.hit);
            
            if (keys[' '] && canJump){
                player.applyImpulse(new BABYLON.Vector3(0, 20, 0), player.getAbsolutePosition());
            }
            
            //if we fell
            if(player.position.y < -20) {
            	die();
            }

            click = false;
            var f = frame / 60;
            timeDiv.textContent = Math.floor(f / 60) + ":" + Math.floor(f % 60) + ":" + Math.floor(frame % 60);
    		frame += 1;//why?
        });
        function pointerLock(){
            canvas.requestPointerLock();
            click = true;
        }
        //lock 'em up tight
        document.addEventListener("click", pointerLock);
        
        return scene;
    }
